name: Build Android 64-bit APK (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      reltype:
        description: 'Release type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Publish directly to GitHub Releases?'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Release tag name (e.g. v1.5.1-root)'
        required: false
        default: 'v1.5.1-root'
        type: string
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  build-arm64-apk:
    name: Build RustDesk Android arm64-v8a APK
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            gcc-multilib \
            g++ \
            g++-multilib \
            git \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch Flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [ -f "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" ]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: "rustfmt"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-v8a-build

      - name: Setup vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg C/C++ dependencies for arm64-v8a
        run: |
          ./flutter/build_android_deps.sh arm64-v8a
        shell: bash

      - name: Generate Flutter Rust Bridge files
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
        shell: bash

      - name: Build RustDesk native library (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
        shell: bash

      - name: Build Android arm64-v8a APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Use debug signing config so built APK is installable without custom secrets
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          pushd flutter
          REL_MODE="${{ github.event.inputs.reltype || 'release' }}"
          flutter build apk "--${REL_MODE}" --target-platform android-arm64 --split-per-abi
          popd
        shell: bash

      - name: Test root input queue
        working-directory: flutter/android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: ./gradlew :app:testReleaseUnitTest --tests com.carriez.flutter_hbb.RootInputQueueTest

      - name: Prepare APK for Artifact and Release
        run: |
          mkdir -p release-pkg
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-*.apk release-pkg/rustdesk-arm64-v8a-root.apk
        shell: bash

      - name: Upload 64-bit Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-arm64-v8a-root-release
          path: release-pkg/rustdesk-arm64-v8a-root.apk

      - name: Publish to GitHub Releases
        if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'latest' }}
          name: RustDesk for Root (arm64-v8a) Latest
          draft: false
          prerelease: false
          make_latest: true
          files: release-pkg/rustdesk-arm64-v8a-root.apk
          body: |
            ### 📱 RustDesk Android 64-bit (arm64-v8a) Root 增强版
            
            - **目标架构**：`arm64-v8a` (64 位 Android)
            - **无障碍脱离**：通过底层 Root 管道直接注入事件，无需开启系统无障碍服务，永不被系统查杀
            - **锁屏远程控制**：连接或操作时自动唤醒屏幕并拉起锁屏密码盘，可直接远程输入 PIN 码或九宫格解锁
            - **静默录屏授权**：自动授权 `PROJECT_MEDIA allow`，适配无人值守场景
            - **控制端兼容性**：控制端使用 RustDesk 官方正式版即可，无需特殊客户端
